<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
  <title>StageLab</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StageLab" />
  <meta name="theme-color" content="#08080f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://dsegdddquztgkdwyzbai.supabase.co" crossorigin />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    html { -webkit-text-size-adjust: 100%; height: 100%; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #08080f; overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
    body { touch-action: pan-y; position: fixed; width: 100%; }
    #root { width: 100vw; height: 100vh; height: 100dvh; }
    input, textarea, select { font-family: inherit; font-size: 16px !important; -webkit-appearance: none; appearance: none; border-radius: 0; }
    input[type="range"] { appearance: auto; -webkit-appearance: auto; }
    button { font-family: inherit; touch-action: manipulation; -webkit-appearance: none; cursor: pointer; }
    * { -webkit-overflow-scrolling: touch; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    button:active { opacity: 0.7; transform: scale(0.98); transition: transform 0.1s; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
