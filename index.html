<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>StageLab</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#08080f" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #08080f; }
    #root { width: 100vw; height: 100dvh; }
    input, textarea, button { font-family: inherit; }
    #status { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#c9a84c; font-family:monospace; font-size:13px; text-align:center; }
    #err { position:fixed; top:20px; left:10px; right:10px; background:#ff000033; border:1px solid red; padding:12px; border-radius:8px; font-family:monospace; font-size:11px; color:#fff; word-break:break-all; display:none; z-index:9999; }
  </style>
</head>
<body>
  <div id="status">Loading StageLab...</div>
  <div id="err"></div>
  <div id="root"></div>
  <script>
    window.onerror = function(msg,src,line,col,err) {
      document.getElementById('err').style.display='block';
      document.getElementById('err').textContent = msg + ' (line '+line+')';
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"
    onload="document.getElementById('status').textContent='React ✓ Loading ReactDOM...'"
    onerror="document.getElementById('err').style.display='block';document.getElementById('err').textContent='Failed: react from jsdelivr'"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"
    onload="document.getElementById('status').textContent='ReactDOM ✓ Loading app...'"
    onerror="document.getElementById('err').style.display='block';document.getElementById('err').textContent='Failed: react-dom from jsdelivr'"></script>
  <script src="app.js"
    onload="document.getElementById('status').style.display='none'"
    onerror="document.getElementById('err').style.display='block';document.getElementById('err').textContent='Failed to load app.js'"></script>
</body>
</html>
